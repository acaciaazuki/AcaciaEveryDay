<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ACACIA" />
    <!--
      刻意不加 maximum-scale=1 / user-scalable=no：那樣會讓使用者無法雙指放大（Android 與無障礙都受影響）。
      點輸入框自動放大的問題改由 CSS 讓輸入框在手機上至少 16px 解決（見 src/index.css）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7faf8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ACACIA Everyday</title>
  </head>
  <body>
    <script>
      // 先套用上次選的字體大小，避免載入時畫面先閃一下標準大小
      try {
        var s = { sm: 0.9, md: 1, lg: 1.15, xl: 1.3 }[localStorage.getItem('acacia_font_size')]
        if (s) document.documentElement.style.setProperty('--fs', String(s))
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
